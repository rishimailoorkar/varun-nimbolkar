<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varun Nimbolkar — Record Island</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:36px 18px 50px;background:radial-gradient(circle at 50% -10%,#f6f6f7,#e6e6e8 55%,#dcdcdf);font-family:Inter,"Plus Jakarta Sans",Arial,sans-serif;color:#f5f5f7}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #d39de0;outline-offset:3px}.island{width:min(100%,820px);margin:0 auto;background:#080809;border:1px solid #27272a;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px #0003;transition:border-radius .7s cubic-bezier(.2,.8,.2,1),transform .7s}.island.closed{width:min(100%,360px);height:62px;border-radius:0 0 30px 30px;overflow:hidden}.island.closed .island-content{opacity:0;transform:translateY(-14px);pointer-events:none}.island.closed .island-top{height:60px}.island-top{height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px;border-bottom:1px solid #ffffff13;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#a6a6ab}.top-state{display:flex;gap:9px;align-items:center;color:#f4f4f5}.target{width:9px;height:9px;border:1px solid #d4a1e2;border-radius:50%;box-shadow:0 0 10px #d4a1e288}.top-queue{justify-self:center}.top-count{justify-self:end}.island-content{display:grid;grid-template-columns:minmax(220px,.95fr) minmax(300px,1.05fr);gap:22px;padding:24px;opacity:1;transform:none;transition:opacity .35s ease,transform .5s ease}.deck{min-height:340px;position:relative;display:grid;place-items:center;overflow:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 43%,#2c2b30,#141416 54%,#0c0c0d 80%)}.deck:after{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff12,transparent 30%,#0004);pointer-events:none}.record-wrap{position:relative;width:min(84%,290px);aspect-ratio:1;border-radius:50%;padding:4.2%;background:radial-gradient(circle,#080809 0 64%,#6b686d 64.6%,#111 66%,#29282b 71%,#09090a 76%);box-shadow:0 15px 34px #000b}.record{width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;background:repeating-radial-gradient(circle,#121214 0 2px,#242326 3px,#0a0a0c 5px);box-shadow:inset 0 0 22px #000}.record.spinning{animation:spin 2.8s linear infinite}.record:before{content:"";position:absolute;inset:28%;border-radius:50%;background:linear-gradient(135deg,#453843,#171619 65%);box-shadow:0 0 0 2px #aaaaaa22;z-index:1}.record:after{content:"VN";position:absolute;z-index:2;inset:0;display:grid;place-items:center;font:500 13px Georgia,serif;letter-spacing:.08em;color:#e7dce4}.grooves{position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 8px,#fff1 9px,#0003 10px,transparent 12px),conic-gradient(transparent,#fff3 34deg,transparent 70deg,transparent 210deg,#fff2 255deg,transparent 300deg);mix-blend-mode:screen}.spindle{position:absolute;z-index:3;left:50%;top:50%;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);background:#eee}.tonearm{position:absolute;width:7px;height:48%;top:13%;right:17%;border-radius:5px;background:linear-gradient(90deg,#45464a,#e4e4e5,#77787a);transform-origin:50% 8%;transform:rotate(-8deg);transition:transform .6s}.playing .tonearm{transform:rotate(15deg)}.record-actions{position:absolute;left:20px;right:20px;bottom:18px;z-index:4;display:flex;justify-content:space-between;align-items:center}.round-control{border:1px solid #ffffff44;border-radius:50%;width:42px;height:42px;background:#111c;display:grid;place-items:center}.transport{display:flex;gap:10px}.deck-label{position:absolute;left:20px;top:18px;z-index:2;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#c5c2c8}.listen{min-width:0;padding:6px 0}.listen-head{display:flex;justify-content:space-between;align-items:end;padding:0 4px 14px;border-bottom:1px solid #ffffff24}.listen-head strong{font:400 28px/1.1 Georgia,serif}.listen-head span{font-size:10px;color:#aaa;letter-spacing:.12em;text-transform:uppercase}.track-list{display:grid}.track{display:grid;grid-template-columns:35px 1fr auto;gap:12px;align-items:center;padding:13px 8px;border:0;border-bottom:1px solid #ffffff1b;background:transparent;text-align:left;color:#aaa;transition:color .2s,background .2s}.track:hover{color:white;background:#ffffff08}.track[aria-current=true]{color:#fff;background:#ffffff0d}.track-num{font-size:9px;letter-spacing:.1em;color:#8e8e93}.track-copy strong,.track-copy small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-copy strong{font-size:12px;font-weight:600}.track-copy small{margin-top:4px;font-size:10px;color:#929197}.track-state{font-size:8px;letter-spacing:.12em;color:#d2a0df}.track-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 6px 0;color:#929197;font-size:10px}.spotify{color:#eee;text-decoration:none;border-bottom:1px solid #777;padding-bottom:2px}.status{min-height:18px;margin:12px 6px 0;color:#aaa;font-size:10px}.collapse{border:0;background:transparent;color:#aaa;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px 0}.below{max-width:820px;margin:20px auto 0;color:#555;font-size:11px;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between}.eq{display:flex;align-items:center;gap:3px;height:12px}.eq i{width:2px;height:5px;background:#eee;animation:eq .7s ease-in-out infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}@keyframes spin{to{transform:rotate(360deg)}}@keyframes eq{to{height:11px}}@media(max-width:680px){body{padding:20px 12px 36px}.island{border-radius:22px}.island-content{grid-template-columns:1fr;gap:14px;padding:14px}.deck{min-height:300px}.record-wrap{width:min(70vw,270px)}.listen-head strong{font-size:24px}.track{padding:11px 6px}.island-top{padding:0 14px}.below{padding:0 5px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="island playing" id="island" aria-label="Varun Nimbolkar music player">
 <header class="island-top"><span class="top-state"><i class="target"></i>Now spinning</span><span class="top-queue">Queue</span><span class="top-count">5 tracks</span></header>
 <div class="island-content">
  <section class="deck" aria-label="Vinyl player"><span class="deck-label">Varun Nimbolkar · Listening room</span><div class="record-wrap"><div class="record spinning" id="record"><i class="grooves"></i><i class="spindle"></i></div></div><div class="tonearm"></div><div class="record-actions"><button class="round-control" id="play" aria-label="Play music">▶</button><div class="transport"><button class="round-control" id="prev" aria-label="Previous track">|◀</button><button class="round-control" id="next" aria-label="Next track">▶|</button></div></div></section>
  <section class="listen" aria-label="Music queue"><header class="listen-head"><strong>Now playing</strong><span id="position">01 / 10</span></header><div class="track-list" id="tracks"></div><div class="track-foot"><span>VARUN NIMBOLKAR</span><a class="spotify" href="https://open.spotify.com/artist/3dmI9UkzIOZZeHcdLJfXZs" target="_blank" rel="noopener">Spotify ↗</a></div><p class="status" id="status" role="status">Loading Spotify player…</p></section>
 </div>
</main><div class="below"><span>Tradition meets electricity</span><button class="collapse" id="collapse">Close island ↑</button></div>
<div id="spotify-player" hidden></div>
<script>
const songs=[
  {id:'7lDrYmlCO2YzFSLLzlmyRv',title:'Meera',artist:'Varun Nimbolkar'},
  {id:'73A1OKz2pcuu7FlPMpglpB',title:'Amrita 2.0',artist:'Varun Nimbolkar'},
  {id:'4evm9RtGfq6V8kGJEB4qU5',title:"Queen's Bath",artist:'Varun Nimbolkar'},
  {id:'0Gz7XEiXXFldwytS3MQh7Z',title:'!Okay',artist:'Varun Nimbolkar'},
  {id:'4rtUWUAqAWLh0jJIdAPRDl',title:'Amrita',artist:'Varun Nimbolkar'},
  {id:'6djK9hRBbatFZ4EaiVMTB5',title:'Rosemary, For Remembrance',artist:'Varun Nimbolkar'},
  {id:'1T697gcRlo6nVYzKj6ryNL',title:'Remnants',artist:'Varun Nimbolkar'},
  {id:'1iIMMjVR4YMSoLkXwI4qLR',title:'Rishikesh (Child of the Ganges)',artist:'Varun Nimbolkar'},
  {id:'6SGGfkRmvRVJzdOimZFEa6',title:'Watching Her Dance',artist:'Varun Nimbolkar'},
  {id:'1xuLfcXNcA3J2qLZGFQ3kB',title:'The Unposted Letter',artist:'Varun Nimbolkar'}
];let active=0,player=null,ready=false,isPlaying=false;const $=id=>document.getElementById(id), island=$('island');function draw(){ $('tracks').innerHTML=songs.map((s,i)=>`<button class="track" data-i="${i}" aria-current="${i===active}"><span class="track-num">${String(i+1).padStart(2,'0')}</span><span class="track-copy"><strong>${s.title}</strong><small>${s.artist}</small></span><span class="track-state">${i===active?(isPlaying?'<span class="eq"><i></i><i></i><i></i><i></i></span>':'NOW PLAYING'):'PLAY'}</span></button>`).join('');$('position').textContent=`${String(active+1).padStart(2,'0')} / 10`;$('status').textContent=isPlaying?`Playing · ${songs[active].title}`:ready?`Ready · ${songs[active].title}`:'Loading Spotify player…';$('play').textContent=isPlaying?'Ⅱ':'▶';island.classList.toggle('playing',isPlaying)}function choose(n,play=true){active=(n+songs.length)%songs.length;draw();if(ready&&player){player.loadUri(`spotify:track:${songs[active].id}`);if(play&&player.play)player.play()}}$('tracks').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)choose(+b.dataset.i)});$('next').onclick=()=>choose(active+1);$('prev').onclick=()=>choose(active-1);$('play').onclick=()=>{if(ready&&player)player.togglePlay();else $('status').textContent='Spotify is still loading…'};$('collapse').onclick=()=>{island.classList.toggle('closed');$('collapse').textContent=island.classList.contains('closed')?'Open island ↓':'Close island ↑'};draw();window.onSpotifyIframeApiReady=API=>API.createController($('spotify-player'),{uri:`spotify:track:${songs[active].id}`,width:'100%',height:1},embed=>{player=embed;embed.addListener('ready',()=>{ready=true;draw()});embed.addListener('playback_update',e=>{isPlaying=!e.data.isPaused&&!e.data.isBuffering;if(e.data.track?.name&&songs[active].title.startsWith('Spotify Track'))songs[active].title=e.data.track.name;draw()})});const api=document.createElement('script');api.src='https://open.spotify.com/embed/iframe-api/v1';api.async=true;api.onerror=()=>{$('status').textContent='Spotify could not load. Open the artist page to listen.'};document.head.appendChild(api);
</script></body></html>
